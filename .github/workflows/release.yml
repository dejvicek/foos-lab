name: Vydání

# Vydání jde jen z tagu vX.Y.Z na main (tag se vytváří na pokyn, viz README → Vydání nové verze).
# Kontroly → testy → sestavení → nasazení na GitHub Pages → GitHub Release s poznámkami z CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag sedí s package.json, je na main a má záznam v CHANGELOG.md
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nesedí s verzí v package.json ($pkg)."; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME není na větvi main. Vydává se jen z main po merge z develop."; exit 1
          fi
          sh scripts/changelog-section.sh "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Kontrola nastavení Supabase
        run: |
          if [ -z "${{ vars.VITE_SUPABASE_URL }}" ] || [ -z "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Chybí proměnné repozitáře VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Kontrola migrací a funkcí databáze (lokální Postgres v Dockeru)
        run: sh supabase/tests/run.sh
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: GitHub Release s poznámkami z CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Foos Lab ${{ needs.build.outputs.version }}" --notes-file release-notes.md --verify-tag
